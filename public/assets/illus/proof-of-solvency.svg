<svg width="176" height="176" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pos_lime" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B7E356"/>
      <stop offset="1" stop-color="#8CC63F"/>
    </linearGradient>
    <linearGradient id="pos_coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCF3AE"/>
      <stop offset="1" stop-color="#C4E88A"/>
    </linearGradient>
  </defs>

  <!-- soft green background blob -->
  <path d="M150 660 C170 520 320 470 500 480 C700 490 840 540 850 660 C858 780 700 800 500 792 C300 800 132 790 150 660 Z" fill="#EAFFC4" fill-opacity="0.55"/>

  <!-- decorative shapes -->
  <circle cx="512" cy="185" r="18" fill="#8ED04F"/>
  <circle cx="836" cy="720" r="26" fill="#FFD84D"/>
  <g transform="rotate(45 205 560)"><rect x="182" y="537" width="40" height="40" rx="7" fill="none" stroke="#8ED04F" stroke-width="10"/></g>

  <!-- lime coin (top) -->
  <ellipse cx="642" cy="188" rx="60" ry="66" fill="#EDF6D9" stroke="#111" stroke-width="4"/>
  <ellipse cx="642" cy="182" rx="46" ry="52" fill="url(#pos_coin)" stroke="#111" stroke-width="3"/>
  <g stroke="#8CC63F" stroke-width="3"><line x1="642" y1="140" x2="642" y2="224"/><line x1="600" y1="182" x2="684" y2="182"/><line x1="612" y1="152" x2="672" y2="212"/><line x1="672" y1="152" x2="612" y2="212"/></g>

  <!-- document / scroll -->
  <g transform="rotate(-6 470 500)">
    <!-- bottom curl -->
    <path d="M470 660 h230 q22 40 -12 78 l-218 -18 Z" fill="#fff" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <!-- main body -->
    <rect x="238" y="250" width="440" height="430" rx="6" fill="#fff" stroke="#111" stroke-width="6"/>
    <!-- top-left curl -->
    <path d="M238 262 q-70 16 -60 96 l60 -22 Z" fill="#cfcfcf" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
    <!-- dashed inner border -->
    <rect x="256" y="268" width="404" height="394" rx="4" fill="none" stroke="#c8c8c8" stroke-width="3" stroke-dasharray="7 9"/>

    <!-- checklist rows -->
    <g>
      <!-- row 1 -->
      <circle cx="340" cy="350" r="27" fill="#F1F1F1"/>
      <circle cx="340" cy="342" r="9" fill="#8ED04F"/>
      <path d="M325 364 a15 13 0 0 1 30 0 Z" fill="#8ED04F"/>
      <rect x="388" y="340" width="170" height="9" rx="4.5" fill="#DBDBDB"/>
      <rect x="388" y="357" width="120" height="9" rx="4.5" fill="#ECECEC"/>
      <!-- row 2 -->
      <circle cx="340" cy="440" r="27" fill="#F1F1F1"/>
      <circle cx="340" cy="432" r="9" fill="#8ED04F"/>
      <path d="M325 454 a15 13 0 0 1 30 0 Z" fill="#8ED04F"/>
      <rect x="388" y="430" width="170" height="9" rx="4.5" fill="#DBDBDB"/>
      <rect x="388" y="447" width="120" height="9" rx="4.5" fill="#ECECEC"/>
      <!-- row 3 -->
      <circle cx="340" cy="530" r="27" fill="#F1F1F1"/>
      <circle cx="340" cy="522" r="9" fill="#8ED04F"/>
      <path d="M325 544 a15 13 0 0 1 30 0 Z" fill="#8ED04F"/>
      <rect x="388" y="520" width="170" height="9" rx="4.5" fill="#DBDBDB"/>
      <rect x="388" y="537" width="120" height="9" rx="4.5" fill="#ECECEC"/>
      <!-- row 4 -->
      <circle cx="340" cy="620" r="27" fill="#F1F1F1"/>
      <circle cx="340" cy="612" r="9" fill="#8ED04F"/>
      <path d="M325 634 a15 13 0 0 1 30 0 Z" fill="#8ED04F"/>
      <rect x="388" y="610" width="170" height="9" rx="4.5" fill="#DBDBDB"/>
      <rect x="388" y="627" width="120" height="9" rx="4.5" fill="#ECECEC"/>
    </g>
  </g>

  <!-- magnifying glass -->
  <g transform="rotate(8 640 460)">
    <rect x="700" y="520" width="150" height="52" rx="26" fill="#cfcfcf" stroke="#111" stroke-width="6" transform="rotate(38 700 520)"/>
    <circle cx="640" cy="450" r="128" fill="#fff" stroke="#111" stroke-width="10"/>
    <circle cx="640" cy="450" r="100" fill="none" stroke="#111" stroke-width="6"/>
  </g>

  <!-- lime with check (bottom-left) -->
  <circle cx="300" cy="730" r="96" fill="url(#pos_lime)" stroke="#111" stroke-width="6"/>
  <circle cx="300" cy="730" r="74" fill="#fff"/>
  <circle cx="300" cy="730" r="62" fill="url(#pos_lime)"/>
  <g stroke="#fff" stroke-width="4" opacity="0.85"><line x1="300" y1="668" x2="300" y2="792"/><line x1="238" y1="730" x2="362" y2="730"/><line x1="256" y1="686" x2="344" y2="774"/><line x1="344" y1="686" x2="256" y2="774"/></g>
  <path d="M266 730 l26 30 l58 -66" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
